rules = [
  DisableSyntax,
  NoOptionGet,
  NoTryGet,
  NoEitherProjectionGet,
  NoEmptySensitiveCollectionOps,
  NoUnimplementedPlaceholder,
  NoDiscardedFailureResult,
  NoArrayValueEquality,
  NoInferredAny,
  NoIncompatibleEquality,
  NoImplicitArrayEqualityInCollections,
  NoMutableEqualityKey,
  NoEmbeddedCredentials,
  NoUnsafeSqlConstruction,
  NoTlsVerificationBypass,
  NoWeakCryptographicConfiguration,
  NoUncheckedJavaDeserialization,
  NoPredictableSecurityRandom,
  NoStructuralIndentation
]
DisableSyntax.noFinalize = true
