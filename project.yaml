project:
  namespace: "org.simplemodeling.textus"
  id: "SmWorkflow"
  name: "textus-sm-workflow"
  title: "SM Workflow"
  kind: car
  organization: "org.simplemodeling.textus"
  scalaPackage: "org.simplemodeling.textus.smworkflow"
  component:
    name: "SmWorkflow"
    className: "SmWorkflowComponent"
    displayName: "SM Workflow"
    version: "0.1.0-SNAPSHOT"

build:
  scalaVersion: "3.3.8"
  cozyVersion: "0.3.3-SNAPSHOT"
  dependencies:
    compile:
      - "org.goldenport::goldenport-cncf:0.5.3-SNAPSHOT"
      - "org.scalatest::scalatest:3.2.19"
    test:
      - "org.scalatest::scalatest:3.2.19"

cml:
  source: "src/main/cozy/sm-workflow.cml"

publication:
  source_manifest:
    enabled: false

packaging:
  kind: car
  car:
    abi:
      dependencies: []
    manifest_metadata:
      boundedContext: "software-development-workflow"
      domain: "software-development"
    runtime:
      cncf:
        minimum: "0.5.3-SNAPSHOT"
        excluded: []
        tested:
          - "0.5.3-SNAPSHOT"

warehouse:
  repository_artifacts:
    include:
      - car
    modules:
      - "textus-sm-workflow"
